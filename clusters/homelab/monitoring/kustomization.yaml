apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-monitoring
  dependsOn:
    - name: monitoring-sources
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-sources
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab/monitoring/sources
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-monitoring
  dependsOn:
    - name: monitoring-namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-namespace
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-monitoring

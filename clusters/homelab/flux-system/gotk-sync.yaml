# --- Sources ---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/elizabetht/homelab
  ref:
    branch: main
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: token-labs
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/elizabetht/token-labs
  ref:
    branch: main
  secretRef:
    name: flux-system
---
# --- Base infrastructure (metallb, longhorn, gpu-operator, nvidia-dra-driver) ---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  wait: true
  timeout: 30m
---
# MetalLB IP pool — retries until MetalLB CRDs are ready
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./infrastructure/metallb
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: infrastructure
---
# Longhorn StorageClass config — retries until Longhorn CRDs are ready
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/longhorn
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: infrastructure
---
# --- Monitoring ---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-namespace
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-sources
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab/monitoring/sources
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: monitoring-namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: monitoring-sources
    - name: infrastructure
---
# --- token-labs (LLM inference platform — depends on base infrastructure) ---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: token-labs
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: token-labs
  dependsOn:
    - name: infrastructure

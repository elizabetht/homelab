---
# controller-setup — runs on the control-plane node after kubeadm-init.
# Installs Helm, then bootstraps Flux so GitOps takes over everything else.

# ── Helm ───────────────────────────────────────────────────────────────────────
- name: Check if helm is installed
  command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Install Helm {{ helm_version }}
  when: helm_check.rc != 0
  block:
    - name: Download Helm installer
      get_url:
        url: "https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3"
        dest: /tmp/get-helm.sh
        mode: "0700"

    - name: Run Helm installer
      command: /tmp/get-helm.sh
      environment:
        DESIRED_VERSION: "{{ helm_version }}"

# ── Flux bootstrap ─────────────────────────────────────────────────────────────
- name: Check if flux CLI is installed
  command: flux version --client
  register: flux_check
  changed_when: false
  failed_when: false

- name: Install flux CLI
  when: flux_check.rc != 0
  shell: curl -s https://fluxcd.io/install.sh | bash
  args:
    creates: /usr/local/bin/flux

- name: Check if Flux is already bootstrapped
  command: kubectl get namespace flux-system
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: flux_ns_check
  changed_when: false
  failed_when: false

- name: Bootstrap Flux from GitHub
  command: >
    flux bootstrap github
    --owner={{ flux_github_owner }}
    --repository={{ flux_github_repo }}
    --branch={{ flux_github_branch }}
    --path={{ flux_path }}
    --personal
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    GITHUB_TOKEN: "{{ flux_github_token }}"
  when:
    - flux_ns_check.rc != 0
    - flux_github_token is defined
    - flux_github_token | length > 0

all:
  vars:
    ansible_user: nvidia
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    kubernetes_version: "1.32.13"
    pod_cidr: "10.244.0.0/16"

cluster:
  children:
    control_plane:
      hosts:
        controller:
          ansible_host: 192.168.1.75
          ansible_connection: local   # playbook runs ON the controller — no SSH to itself
    workers:
      hosts:
        spark-01:
          ansible_host: 192.168.1.76
        spark-02:
          ansible_host: 192.168.1.77

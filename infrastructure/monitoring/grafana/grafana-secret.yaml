# Grafana admin credentials Secret
# IMPORTANT: Replace the base64 values before applying.
# Generate with:
#   echo -n 'admin' | base64
#   echo -n 'your-secure-password' | base64
#
# For production use, consider using Sealed Secrets or External Secrets Operator
# instead of committing plain Secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
type: Opaque
data:
  admin-user: YWRtaW4=           # base64("admin") — change if desired
  admin-password: Y2hhbmdlbWU=   # base64("changeme") — CHANGE THIS

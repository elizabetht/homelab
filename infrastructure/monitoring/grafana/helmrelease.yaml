# NOTE: Grafana is already bundled in kube-prometheus-stack.
# This HelmRelease is provided as an OPTIONAL standalone Grafana deployment.
# Only apply this if you disabled grafana in the kube-prometheus-stack values
# (set grafana.enabled: false there first).
#
# To use standalone Grafana instead:
#   1. Set grafana.enabled: false in prometheus/values.yaml
#   2. Uncomment and apply this file
#   3. Add the grafana HelmRepository source to clusters/homelab/monitoring/sources/


# kube-prometheus-stack homelab values
# Tuned for low resource usage on a home lab cluster

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false         # disable if etcd metrics not exposed
    configReloaders: true
    general: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false  # disable if not exposed
    kubelet: true
    kubeProxy: false              # disable if not exposed
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false  # disable if not exposed
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Control-plane components this cluster does not expose metrics for.
#
# defaultRules above already turns OFF their *alerts*, but the component blocks
# were left enabled, so the chart kept shipping their ServiceMonitors and
# dashboards. The result was four dashboards permanently reading "No data":
#   etcd                          0/16 panels  (etcd_server_has_leader: 0 series)
#   Kubernetes / Scheduler        1/18 panels
#   Kubernetes / Proxy            1/14 panels
#   Kubernetes / Controller Mgr   1/13 panels
# kubeadm binds these to 127.0.0.1, so nothing can scrape them without
# reconfiguring the control plane. Disabling removes both the futile scrape
# targets and the empty dashboards.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Persistent storage - uncomment to enable
    # storage:
    #   volumeClaimTemplate:
    #     spec:
    #       storageClassName: local-path
    #       accessModes: [ReadWriteOnce]
    #       resources:
    #         requests:
    #           storage: 5Gi

grafana:
  enabled: true
  adminPassword: ""   # Leave empty — set via Secret (see grafana-secret.yaml)
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Persistent storage - uncomment to enable
  # persistence:
  #   enabled: true
  #   storageClassName: local-path
  #   size: 5Gi
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.206
    port: 80
  # The chart ships a "Grafana Overview" dashboard but does not scrape Grafana
  # by default, so all 7 of its panels read "No data" (grafana_build_info had
  # 0 series). Grafana exposes /metrics already -- it just needed a target.
  # Enabling this is cheaper than deleting a dashboard that becomes useful.
  serviceMonitor:
    enabled: true
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
    # Persistent storage - uncomment to enable
    # storageSpec:
    #   volumeClaimTemplate:
    #     spec:
    #       storageClassName: local-path
    #       accessModes: [ReadWriteOnce]
    #       resources:
    #         requests:
    #           storage: 20Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

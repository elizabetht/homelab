---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.14.0"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 10m
  targetNamespace: arc-systems
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

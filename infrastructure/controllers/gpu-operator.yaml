---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: gpu-operator
      version: "v26.7.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      interval: 5m
  targetNamespace: gpu-operator
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  values:
    operator:
      defaultRuntime: containerd
      # Control-plane only: the operator reconciles ClusterPolicy, it never
      # touches a GPU. Chart already ships control-plane tolerations, so only
      # the placement half is needed here.
      nodeSelector:
        kubernetes.io/hostname: controller
    # NFD master/gc aggregate labels reported by the workers -- also pure
    # control plane. The `worker` DaemonSet is deliberately NOT pinned: it is
    # what discovers node hardware and must run on every node.
    node-feature-discovery:
      master:
        nodeSelector:
          kubernetes.io/hostname: controller
      gc:
        nodeSelector:
          kubernetes.io/hostname: controller
        # gc is the one subcomponent with no default control-plane toleration.
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
    driver:
      enabled: false  # Driver already installed on host via Ansible
    toolkit:
      enabled: false  # Already installed on host via Ansible
    devicePlugin:
      enabled: true
      # Preserve the existing per-node exclusive/time-slicing selection.
      config:
        name: time-slicing-config
        default: any
    dcgm:
      enabled: true
    dcgmExporter:
      enabled: true
      # Keep the verified custom GB10 field list during chart upgrades.
      config:
        name: dcgm-metrics-config
      serviceMonitor:
        enabled: true
    migManager:
      enabled: true
    nodeStatusExporter:
      enabled: true
    gfd:
      enabled: true

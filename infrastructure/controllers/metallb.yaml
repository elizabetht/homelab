---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: "0.14.*"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
  targetNamespace: metallb-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Pin only the IPAM controller to the control-plane node, matching the
    # Flux controllers. Keeps LoadBalancer IP allocation alive when a GPU
    # node goes NotReady, and keeps the GPU nodes for GPU work.
    controller:
      nodeSelector:
        kubernetes.io/hostname: controller
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    # NOTE: the speaker DaemonSet is deliberately left untouched. It is the
    # L2 data path -- it must run on every node that can answer ARP for the
    # VIPs. `controller` additionally carries the
    # node.kubernetes.io/exclude-from-external-load-balancers label, so
    # MetalLB will not elect it as announcer anyway.

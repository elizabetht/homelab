apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  labels:
    app.kubernetes.io/name: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName intentionally unset — uses the cluster default
  # (Longhorn in this homelab).

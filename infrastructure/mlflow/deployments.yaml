{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "mlflow",
    "namespace": "mlflow"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app": "mlflow"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "mlflow"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "command": [
              "/opt/venv/bin/python",
              "/bootstrap/server.py"
            ],
            "env": [
              {
                "name": "POSTGRES_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "postgres-password",
                    "name": "mlflow-credentials"
                  }
                }
              },
              {
                "name": "AWS_ACCESS_KEY_ID",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "s3-access-key",
                    "name": "mlflow-credentials"
                  }
                }
              },
              {
                "name": "AWS_SECRET_ACCESS_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "s3-secret-key",
                    "name": "mlflow-credentials"
                  }
                }
              },
              {
                "name": "AWS_DEFAULT_REGION",
                "value": "us-east-1"
              },
              {
                "name": "MLFLOW_S3_ENDPOINT_URL",
                "value": "http://mlflow-s3:8333"
              },
              {
                "name": "MLFLOW_SERVER_ALLOWED_HOSTS",
                "value": "localhost:*,127.0.0.1:*,mlflow:*,mlflow.mlflow:*,mlflow.mlflow.svc:*,mlflow.mlflow.svc.cluster.local:*,192.168.1.75:30500,controller:30500"
              },
              {
                "name": "MLFLOW_SERVER_CORS_ALLOWED_ORIGINS",
                "value": "http://192.168.1.75:30500"
              }
            ],
            "image": "python:3.12-slim-bookworm",
            "imagePullPolicy": "IfNotPresent",
            "name": "mlflow",
            "ports": [
              {
                "containerPort": 5000,
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/health",
                "port": 5000,
                "scheme": "HTTP"
              },
              "periodSeconds": 5,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "cpu": "1",
                "memory": "2Gi"
              },
              "requests": {
                "cpu": "250m",
                "memory": "512Mi"
              }
            },
            "startupProbe": {
              "failureThreshold": 60,
              "httpGet": {
                "path": "/health",
                "port": 5000,
                "scheme": "HTTP"
              },
              "periodSeconds": 5,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/opt/venv",
                "name": "venv"
              },
              {
                "mountPath": "/bootstrap",
                "name": "bootstrap"
              }
            ]
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "initContainers": [
          {
            "command": [
              "sh",
              "-ec",
              "python -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir -r /bootstrap/requirements.txt"
            ],
            "env": [
              {
                "name": "MLFLOW_SERVER_CORS_ALLOWED_ORIGINS",
                "value": "http://192.168.1.75:30500"
              }
            ],
            "image": "python:3.12-slim-bookworm",
            "imagePullPolicy": "IfNotPresent",
            "name": "install",
            "resources": {
              "limits": {
                "cpu": "1",
                "memory": "2Gi"
              },
              "requests": {
                "cpu": "250m",
                "memory": "512Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/opt/venv",
                "name": "venv"
              },
              {
                "mountPath": "/bootstrap",
                "name": "bootstrap"
              }
            ]
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "controller"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 30,
        "tolerations": [
          {
            "effect": "NoSchedule",
            "key": "node-role.kubernetes.io/control-plane",
            "operator": "Exists"
          }
        ],
        "volumes": [
          {
            "emptyDir": {},
            "name": "venv"
          },
          {
            "configMap": {
              "defaultMode": 420,
              "name": "mlflow-bootstrap-bcg5kfb9d8"
            },
            "name": "bootstrap"
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "mlflow-postgres",
    "namespace": "mlflow"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app": "mlflow-postgres"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "kubectl.kubernetes.io/restartedAt": "2026-10-13T22:13:18Z"
        },
        "labels": {
          "app": "mlflow-postgres"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "env": [
              {
                "name": "POSTGRES_USER",
                "value": "mlflow"
              },
              {
                "name": "POSTGRES_DB",
                "value": "mlflow"
              },
              {
                "name": "POSTGRES_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "postgres-password",
                    "name": "mlflow-credentials"
                  }
                }
              },
              {
                "name": "PGDATA",
                "value": "/var/lib/postgresql/data/pgdata"
              }
            ],
            "image": "postgres:17.6-bookworm",
            "imagePullPolicy": "IfNotPresent",
            "name": "postgres",
            "ports": [
              {
                "containerPort": 5432,
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "pg_isready",
                  "-U",
                  "mlflow",
                  "-d",
                  "mlflow"
                ]
              },
              "failureThreshold": 3,
              "periodSeconds": 5,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "cpu": "1",
                "memory": "2Gi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/var/lib/postgresql/data",
                "name": "data"
              }
            ]
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "nodeSelector": {
          "kubernetes.io/hostname": "controller"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 30,
        "tolerations": [
          {
            "effect": "NoSchedule",
            "key": "node-role.kubernetes.io/control-plane",
            "operator": "Exists"
          }
        ],
        "volumes": [
          {
            "hostPath": {
              "path": "/var/lib/mlflow/postgres",
              "type": "DirectoryOrCreate"
            },
            "name": "data"
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "mlflow-s3",
    "namespace": "mlflow"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app": "mlflow-s3"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "kubectl.kubernetes.io/restartedAt": "2026-10-13T22:13:18Z"
        },
        "labels": {
          "app": "mlflow-s3"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "mini",
              "-dir=/data",
              "-ip=127.0.0.1",
              "-ip.bind=0.0.0.0",
              "-webdav=false",
              "-admin.ui=false",
              "-s3.port.iceberg=0",
              "-s3.port.lance=0",
              "-master.volumeSizeLimitMB=1024"
            ],
            "env": [
              {
                "name": "AWS_ACCESS_KEY_ID",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "s3-access-key",
                    "name": "mlflow-credentials"
                  }
                }
              },
              {
                "name": "AWS_SECRET_ACCESS_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "s3-secret-key",
                    "name": "mlflow-credentials"
                  }
                }
              },
              {
                "name": "S3_BUCKET",
                "value": "mlflow-artifacts"
              }
            ],
            "image": "chrislusf/seaweedfs:4.48",
            "imagePullPolicy": "IfNotPresent",
            "name": "s3",
            "ports": [
              {
                "containerPort": 8333,
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "periodSeconds": 5,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 8333
              },
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "cpu": "1",
                "memory": "2Gi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/data",
                "name": "data"
              }
            ]
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "nodeSelector": {
          "kubernetes.io/hostname": "controller"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 30,
        "tolerations": [
          {
            "effect": "NoSchedule",
            "key": "node-role.kubernetes.io/control-plane",
            "operator": "Exists"
          }
        ],
        "volumes": [
          {
            "hostPath": {
              "path": "/var/lib/mlflow/s3",
              "type": "DirectoryOrCreate"
            },
            "name": "data"
          }
        ]
      }
    }
  }
}

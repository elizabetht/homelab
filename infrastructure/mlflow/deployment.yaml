apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate   # SQLite backend store: single writer only
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      # Pin to the amd64 controller: the tracking server needs no GPU,
      # and this avoids any arm64 image surprises on the Spark nodes.
      nodeSelector:
        kubernetes.io/hostname: controller
      containers:
        - name: mlflow
          # Pin to a concrete version after the first successful pull.
          image: ghcr.io/mlflow/mlflow:latest
          args:
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:////data/mlflow.db
            - --default-artifact-root
            - /data/artifacts
            - --serve-artifacts
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data

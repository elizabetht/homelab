{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "labels": {
      "app.kubernetes.io/name": "mlflow"
    },
    "name": "mlflow",
    "namespace": "mlflow"
  },
  "spec": {
    "externalTrafficPolicy": "Cluster",
    "internalTrafficPolicy": "Cluster",
    "ipFamilies": [
      "IPv4"
    ],
    "ipFamilyPolicy": "SingleStack",
    "ports": [
      {
        "name": "http",
        "nodePort": 30500,
        "port": 5000,
        "protocol": "TCP",
        "targetPort": 5000
      }
    ],
    "selector": {
      "app": "mlflow"
    },
    "sessionAffinity": "None",
    "type": "NodePort"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "mlflow-postgres",
    "namespace": "mlflow"
  },
  "spec": {
    "internalTrafficPolicy": "Cluster",
    "ipFamilies": [
      "IPv4"
    ],
    "ipFamilyPolicy": "SingleStack",
    "ports": [
      {
        "port": 5432,
        "protocol": "TCP",
        "targetPort": 5432
      }
    ],
    "selector": {
      "app": "mlflow-postgres"
    },
    "sessionAffinity": "None",
    "type": "ClusterIP"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "mlflow-s3",
    "namespace": "mlflow"
  },
  "spec": {
    "internalTrafficPolicy": "Cluster",
    "ipFamilies": [
      "IPv4"
    ],
    "ipFamilyPolicy": "SingleStack",
    "ports": [
      {
        "port": 8333,
        "protocol": "TCP",
        "targetPort": 8333
      }
    ],
    "selector": {
      "app": "mlflow-s3"
    },
    "sessionAffinity": "None",
    "type": "ClusterIP"
  }
}

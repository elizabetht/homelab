# Reaps orphaned Longhorn model-cache volumes.
#
# The `longhorn-model-cache` StorageClass is reclaimPolicy: Retain, so deleting
# a model PVC leaves its volume (and its data) behind on purpose -- re-pulling a
# 300GB cache is expensive. Nothing ever collected them: by 2026-08-21 twenty
# orphans held 1,524GB of disk and 3,760GB of scheduling quota, and spark-01 was
# at 93% scheduled with 847GB of unusable free space.
#
# Deletion predicate (ALL must hold):
#   1. No PVC in the cluster references the volume (spec.volumeName join)
#   2. state == detached          -- never touch an attached volume
#   3. pvcName starts with `model-cache-`  -- re-downloadable data only
#   4. lastPVCRefAt older than MAX_AGE_DAYS
# Set DRY_RUN=true to report without deleting.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orphan-volume-reaper
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orphan-volume-reaper
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphan-volume-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orphan-volume-reaper
subjects:
  - kind: ServiceAccount
    name: orphan-volume-reaper
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orphan-volume-reaper
  namespace: longhorn-system
spec:
  schedule: "30 4 * * 0"          # Sundays 04:30 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: orphan-volume-reaper
          restartPolicy: OnFailure
          # controller is amd64, the sparks are arm64; pin so the image arch is
          # predictable and the job never competes with model pods for memory.
          nodeSelector:
            kubernetes.io/hostname: controller
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: reaper
              image: alpine/k8s:1.32.1
              # NOT bitnami/kubectl -- Bitnami retired their Docker Hub catalog
              # in 2025 and that tag no longer resolves. alpine/k8s is multi-arch
              # and bundles bash + jq + kubectl.
              env:
                - name: MAX_AGE_DAYS
                  value: "30"
                - name: DRY_RUN
                  value: "false"
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  echo "reaper: max_age_days=${MAX_AGE_DAYS} dry_run=${DRY_RUN}"

                  # Volumes referenced by a live PVC. A Pending PVC has no
                  # volumeName and yields a blank line, so drop empties --
                  # otherwise an empty pattern would match everything below.
                  kubectl get pvc -A \
                    -o jsonpath='{range .items[*]}{.spec.volumeName}{"\n"}{end}' \
                    | grep -v '^$' | sort -u > /tmp/live
                  echo "reaper: $(wc -l < /tmp/live) volume(s) currently bound"

                  # Age filtering in jq, not date(1): this image ships busybox
                  # date, which has no `-d "-30 days"`.
                  kubectl -n longhorn-system get volumes.longhorn.io -o json \
                    | jq -r --argjson maxage "${MAX_AGE_DAYS}" '
                        .items[]
                        | select(.status.state == "detached")
                        | select((.status.kubernetesStatus.pvcName // "") | startswith("model-cache-"))
                        | select((.status.kubernetesStatus.lastPVCRefAt // "") != "")
                        | (.status.kubernetesStatus.lastPVCRefAt | fromdateiso8601) as $ref
                        | select($ref < (now - ($maxage * 86400)))
                        | "\(.metadata.name)\t\(.status.kubernetesStatus.pvcName)\t\(((now - $ref) / 86400) | floor)"
                      ' > /tmp/candidates

                  reaped=0
                  while IFS=$'\t' read -r name pvc age; do
                    [ -n "${name:-}" ] || continue
                    if grep -Fxq "$name" /tmp/live; then
                      echo "SKIP       $name (still bound)"; continue
                    fi
                    if [ "$DRY_RUN" = "true" ]; then
                      echo "WOULD REAP $name (pvc=$pvc, orphaned ${age}d)"
                    else
                      echo "REAPING    $name (pvc=$pvc, orphaned ${age}d)"
                      kubectl delete pv "$name" --ignore-not-found --wait=false
                      kubectl -n longhorn-system delete volumes.longhorn.io "$name" --timeout=120s
                    fi
                    reaped=$((reaped+1))
                  done < /tmp/candidates
                  echo "reaper: ${reaped} volume(s) matched"
